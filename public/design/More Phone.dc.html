<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a1024"/>
    <circle cx="50" cy="50" r="26" fill="#29d0ff" opacity="0.16"/>
    <path d="M50 32 L58 46 L50 46 L58 68 L42 50 L50 50 Z" fill="#29d0ff"/>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --gl-bg-base:#04060f; --gl-bg-card:rgba(4,8,20,.72);
    --gl-cyan:#29d0ff; --gl-cyan-14:rgba(41,208,255,.14); --gl-cyan-30:rgba(41,208,255,.3);
    --gl-purple:#b09cff; --gl-green:#36e07a; --gl-gold:#ffd24a;
    --gl-text-dim:#7d88ad; --gl-text-overlay-60:rgba(200,218,255,.6); --gl-border:rgba(120,150,220,.18);
    --font-display:'Saira Condensed',sans-serif; --font-body:'Barlow Semi Condensed',sans-serif;
  }
  html,body{margin:0;background:var(--gl-bg-base);}*{box-sizing:border-box;}
  a{text-decoration:none;color:inherit}

  *::-webkit-scrollbar{width:0 !important;height:0 !important;display:none !important;}
  *{scrollbar-width:none;}
</style>
</helmet>

<div style="width:390px;height:844px;position:relative;font-family:var(--font-body);color:#fff;background:var(--gl-bg-base);display:flex;flex-direction:column;overflow:hidden" data-screen-label="More Phone">
  <div style="height:47px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600">
    <span>9:41</span><div style="display:flex;align-items:center;gap:6px"><svg width="17" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="7" width="3" height="5" rx="1"></rect><rect x="5" y="4" width="3" height="8" rx="1"></rect><rect x="10" y="1.5" width="3" height="10.5" rx="1"></rect></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#fff" stroke-opacity=".5"></rect><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"></rect><rect x="23" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"></rect></svg></div>
  </div>
  <div style="padding:4px 18px 10px;flex-shrink:0">
    <div style="font-family:var(--font-display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:0;text-transform:uppercase;color:#fff">More</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 18px 84px">
    <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="5">
      <div style="margin-bottom:18px">
        <div style="font-family:var(--font-display);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:{{ grp.color }};margin-bottom:8px">{{ grp.title }}</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ grp.items }}" as="it" hint-placeholder-count="3">
            <a href="{{ it.href }}" style="display:block;border-radius:8px;border:1px solid #d8d1c6;background:#f4efe6;padding:13px 14px">
              <div style="font-family:var(--font-display);font-weight:800;font-size:15px;color:#0f172a">{{ it.name }}</div>
              <div style="font-size:11.5px;color:#334155;margin-top:3px">{{ it.desc }}</div>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- BOTTOM TAB BAR -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-around;background:rgba(2,5,14,.92);border-top:1px solid rgba(41,208,255,.18);backdrop-filter:blur(20px);flex-shrink:0">
    <a href="Student Lobby Phone.dc.html" aria-label="Today" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d88ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg><div style="font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase">Today</div></a>
    <a href="Work Phone.dc.html" aria-label="Work" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d88ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 11 3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><div style="font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase">Work</div></a>
    <a href="Classes Phone.dc.html" aria-label="Classes" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d88ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg><div style="font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase">Classes</div></a>
    <a href="Calendar Phone.dc.html" aria-label="Calendar" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d88ad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><div style="font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase">Calendar</div></a>
    <a href="More Phone.dc.html" aria-label="More" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#ffffff"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg><div style="font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase">More</div></a>
  </div>
</div>

<dc-import name="Agent Fab" bottom="96" hint-size="64px,64px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const groups = [
      {
        title: 'Student tools', color: 'var(--gl-cyan)',
        items: [
          { href: 'Search.dc.html', name: 'Search', desc: 'Find classes, work, notes, and tools' },
          { href: 'Proof Phone.dc.html', name: 'Record', desc: 'Completed work and weekly showcase' },
          { href: 'Wellness Phone.dc.html', name: 'Wellness', desc: 'Energy, sleep, meals, and movement' },
        ],
      },
      {
        title: 'Account', color: '#ff79da',
        items: [
          { href: 'Sharing Phone.dc.html', name: 'Sharing', desc: 'Weekly parent digest' },
          { href: 'Settings Phone.dc.html', name: 'Settings', desc: 'Profile, accessibility, and account' },
        ],
      },
    ];
    return { groups };
  }
}

</script>
</body>
</html>
