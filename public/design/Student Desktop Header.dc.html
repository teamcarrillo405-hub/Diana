<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=Saira+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
</helmet>

<nav aria-label="Primary" style="position:relative;z-index:30;width:100%;height:58px;background:rgba(2,5,14,.72);border-bottom:1px solid rgba(41,208,255,.18);backdrop-filter:blur(20px);font-family:'Barlow Semi Condensed',sans-serif;color:#fff">
  <div style="width:100%;max-width:1440px;height:58px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 22px">
    <a href="Student Lobby.dc.html" title="Diana home" style="display:flex;min-width:92px;height:34px;align-items:center;text-decoration:none">
      <img src="/screendesign/brand/diana-logo-tight.png" alt="Diana" style="display:block;width:auto;height:29px;margin:0;padding:0">
    </a>

    <div style="display:flex;align-items:center;gap:26px;margin-left:6px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase">
      <a href="Student Lobby.dc.html" style="display:inline-block;text-decoration:none;position:relative;color:{{ todayColor }};padding:18px 2px">
        Today
        <sc-if value="{{ todayActive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff;border-radius:2px"></span></sc-if>
      </a>
      <a href="Work.dc.html" style="display:inline-block;text-decoration:none;position:relative;color:{{ workColor }};padding:18px 2px">
        Work
        <sc-if value="{{ workActive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff;border-radius:2px"></span></sc-if>
      </a>
      <a href="Classes.dc.html" style="display:inline-block;text-decoration:none;position:relative;color:{{ classesColor }};padding:18px 2px">
        Classes
        <sc-if value="{{ classesActive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff;border-radius:2px"></span></sc-if>
      </a>
      <a href="Calendar.dc.html" style="display:inline-block;text-decoration:none;position:relative;color:{{ calendarColor }};padding:18px 2px">
        Calendar
        <sc-if value="{{ calendarActive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff;border-radius:2px"></span></sc-if>
      </a>
      <a href="More.dc.html" style="display:inline-block;text-decoration:none;position:relative;color:{{ moreColor }};padding:18px 2px">
        More
        <sc-if value="{{ moreActive }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff;border-radius:2px"></span></sc-if>
      </a>
    </div>

    <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
      <a href="Quick Add.dc.html" style="text-decoration:none;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;background:rgba(41,208,255,.14);border:1px solid rgba(41,208,255,.28);font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#29d0ff">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Capture
      </a>

      <div onClick="{{ recordAction }}" style="display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:8px;cursor:pointer;border:1.5px solid rgba(255,85,85,.55);background:rgba(255,55,55,.16)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        <span style="font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:17px;letter-spacing:.08em;color:#ffffff">VOICE NOTE</span>
      </div>

      <a href="Settings.dc.html" title="Profile" style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(41,208,255,.38);flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#29d0ff,#1a6cff);display:flex;align-items:center;justify-content:center;text-decoration:none">
        <sc-if value="{{ hasProfilePhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ profilePhoto }}" alt="You" style="width:100%;height:100%;object-fit:cover"></sc-if>
        <sc-if value="{{ showInitial }}" hint-placeholder-val="{{ true }}"><span style="font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:14px;color:#04080f">{{ initial }}</span></sc-if>
      </a>

      <a href="Settings.dc.html" title="Settings" aria-label="Settings" style="text-decoration:none;width:38px;height:38px;border-radius:8px;background:rgba(120,150,220,.12);border:1px solid rgba(120,150,220,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aab8e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </div>
  </div>
</nav>
</x-dc>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:58},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initial&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;G&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = String(this.props.active || '').toLowerCase();
    const color = (name) => active === name ? '#ffffff' : '#8b96bd';
    const profilePhoto = this.props.profilePhoto || '';

    return {
      todayActive: active === 'today',
      workActive: active === 'work',
      classesActive: active === 'classes',
      calendarActive: active === 'calendar',
      moreActive: active === 'more',
      todayColor: color('today'),
      workColor: color('work'),
      classesColor: color('classes'),
      calendarColor: color('calendar'),
      moreColor: color('more'),
      initial: String(this.props.initial || 'G').slice(0, 2).toUpperCase(),
      profilePhoto,
      hasProfilePhoto: !!profilePhoto,
      showInitial: !profilePhoto,
      recordAction: typeof this.props.onRecord === 'function'
        ? this.props.onRecord
        : () => { window.location.href = 'Quick Add.dc.html'; },
    };
  }
}
</script>
</body>
</html>
