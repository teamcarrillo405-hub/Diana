<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a1024"/>
    <circle cx="50" cy="50" r="26" fill="#29d0ff" opacity="0.16"/>
    <path d="M50 32 L58 46 L50 46 L58 68 L42 50 L50 50 Z" fill="#29d0ff"/>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --gl-bg-base:#0b1428; --gl-bg-card:rgba(4,8,20,.72);
    --gl-cyan:#29d0ff; --gl-cyan-30:rgba(41,208,255,.3); --gl-cyan-18:rgba(41,208,255,.18); --gl-cyan-14:rgba(41,208,255,.14); --gl-cyan-25:rgba(41,208,255,.25);
    --gl-purple:#b09cff; --gl-green:#36e07a; --gl-gold:#ffd24a;
    --gl-text-primary:#fff; --gl-text-muted:#aab8e0; --gl-text-dim:#7d88ad; --gl-text-overlay-60:rgba(200,218,255,.6);
    --gl-border:rgba(120,150,220,.18);
    --font-display:'Saira Condensed',sans-serif; --font-body:'Barlow Semi Condensed',sans-serif;
  }
  html,body{margin:0;background:var(--gl-bg-base);}*{box-sizing:border-box;}
  a{text-decoration:none;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(120,150,220,.3);border-radius:4px}
  /* Record pattern: cards carry the reading load, while the page shell stays calm. */
  [style*="background:var(--gl-bg-card)"] { --gl-bg-card:#f4efe6; --gl-border:#d8d1c6; --gl-border-neutral:#d8d1c6; --gl-text-primary:#0f172a; --gl-text-secondary:#334155; --gl-text-muted:#334155; --gl-text-dim:#334155; --gl-text-overlay-60:#334155; background:#f4efe6 !important; color:#0f172a; box-shadow:0 6px 22px rgba(2,6,23,.1); }
  [style*="border:1px dashed"] { --gl-border:#94a3b8; --gl-text-primary:#0f172a; --gl-text-secondary:#334155; --gl-text-muted:#64748b; --gl-text-dim:#64748b; --gl-text-overlay-60:#64748b; border-color:#94a3b8 !important; background:#fff !important; color:#0f172a; }
</style>
</helmet>

<div style="width:100%;min-height:100vh;font-family:var(--font-body);color:var(--gl-text-primary);background:radial-gradient(circle at 88% 6%,rgba(255,121,218,.11),transparent 30%),var(--gl-bg-base)" data-screen-label="More">

  <!-- APP NAV -->
  <dc-import name="Student Desktop Header" hint-size="1440px,58px"></dc-import>

  <main style="max-width:1440px;margin:0 auto;padding:40px 242px 72px 225px">
    <h1 style="margin:0 0 38px;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:52px;letter-spacing:0;line-height:1;text-transform:uppercase;color:#fff">More</h1>
    <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="2">
      <section style="margin-bottom:34px">
        <div style="font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:{{ grp.color }};margin-bottom:4px">{{ grp.title }}</div>
        <div style="font-size:12.5px;color:var(--gl-text-dim);margin-bottom:14px">{{ grp.sub }}</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
          <sc-for list="{{ grp.items }}" as="it" hint-placeholder-count="3">
            <a href="{{ it.href }}" style="display:block;min-height:112px;border-radius:8px;border:1px solid #d8d1c6;background:#f4efe6;color:#0f172a;box-shadow:0 6px 22px rgba(2,6,23,.1);padding:18px 17px;transition:transform .15s,border-color .15s" style-hover="transform:translateY(-2px);border-color:var(--gl-cyan-30)">
              <div style="font-family:var(--font-display);font-weight:800;font-size:16px;color:#0f172a;text-transform:uppercase">{{ it.name }}</div>
              <div style="font-size:12px;color:#334155;margin-top:5px;line-height:1.4">{{ it.desc }}</div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>

<dc-import name="Agent Fab" hint-size="64px,64px" style="position:fixed;right:26px;bottom:26px;z-index:999"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const groups = [
      {
        id: 'tools', label: 'Student tools', title: 'Student tools', color: 'var(--gl-cyan)',
        sub: 'The tools that sit outside Work, Classes, and Calendar',
        items: [
          { href: 'Search.dc.html', name: 'Search', desc: 'Find classes, work, notes, and tools' },
          { href: 'Proof.dc.html', name: 'Record', desc: 'Completed work and weekly showcase' },
          { href: 'Wellness.dc.html', name: 'Wellness', desc: 'Energy, sleep, meals, and movement' },
        ],
      },
      {
        id: 'account', label: 'Account', title: 'Account', color: '#ff79da',
        sub: 'Family sharing and account controls',
        items: [
          { href: 'Sharing.dc.html', name: 'Sharing', desc: 'Weekly parent digest' },
        ],
      },
    ];
    return {
      groups,
      ...this.avatarVals(),
    };
  }

  avatarVals() {
    const src = (() => { const p = localStorage.getItem('diana-profile-src') || ''; return p.startsWith('blob:') ? '' : p; })();
    const type = localStorage.getItem('diana-avatar-type') || 'none';
    const ox = parseFloat(localStorage.getItem('diana-photo-offset-x')) || 50;
    const oy = parseFloat(localStorage.getItem('diana-photo-offset-y')) || 50;
    const name = localStorage.getItem('diana-profile-name') || 'Grayson';
    const initials = name.trim().split(/\s+/).map((w) => w[0] || '').slice(0, 2).join('').toUpperCase() || 'G';
    return {
      profilePhotoSrc: src,
      avatarPhotoCss: (type === 'upload' && src) ? ('url("' + src + '")') : 'none',
      photoObjectPosition: ox + '% ' + oy + '%',
      isAvatarUpload: type === 'upload',
      hasProfilePhoto: type === 'upload' && !!src,
      isAvatarBoy: type === 'boy',
      isAvatarGirl: type === 'girl',
      showInitialsFallback: type === 'none' || (type === 'upload' && !src),
      initials,
    };
  }
}

</script>
</body>
</html>
