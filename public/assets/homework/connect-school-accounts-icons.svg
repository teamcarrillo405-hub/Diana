<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-label="School account icons connected to a homework workspace">
  <defs>
    <linearGradient id="bg" x1="116" y1="48" x2="914" y2="724" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfdf8"/>
      <stop offset=".56" stop-color="#eaf1e8"/>
      <stop offset="1" stop-color="#dfe8de"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef6ee"/>
      <stop offset=".64" stop-color="#cedbd0"/>
      <stop offset="1" stop-color="#aab8ad"/>
    </linearGradient>
    <linearGradient id="blueTile" x1="0" y1="0" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0cbe0"/>
      <stop offset="1" stop-color="#8da0bf"/>
    </linearGradient>
    <linearGradient id="workspace" x1="205" y1="430" x2="820" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfffb"/>
      <stop offset=".72" stop-color="#effaf4"/>
      <stop offset="1" stop-color="#daf0e6"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#243027" flood-opacity=".2"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity=".9"/>
    </filter>
    <filter id="panelShadow" x="-22%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#334137" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity=".95"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)"/>
  <circle cx="158" cy="146" r="210" fill="#ffffff" opacity=".6" filter="url(#glow)"/>
