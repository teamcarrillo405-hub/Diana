name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  gates:
    # Playwright 1.60 browser dependencies support Ubuntu 24.04; latest can move ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Build-time placeholders — real values live in Vercel. Client pages
      # only embed these; no network calls happen during build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm toolchain
        run: |
          npm install --global npm@11.11.0 --ignore-scripts
          test "$(npm --version)" = "11.11.0"

      - name: Install pinned Gitleaks for release validation
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_BINARY_SHA256: 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509
        run: |
          install_directory="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          archive="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}-linux-x64.tar.gz"
          mkdir --parents "$install_directory"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$install_directory" gitleaks
          chmod 0755 "$install_directory/gitleaks"
          printf '%s  %s\n' "$GITLEAKS_BINARY_SHA256" "$install_directory/gitleaks" | sha256sum --check --status
          "$install_directory/gitleaks" --version | grep --extended-regexp '(^|[[:space:]])8\.30\.1([[:space:]]|$)'
          printf '%s\n' "$install_directory" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Require deterministic lockfile install
        run: git diff --exit-code -- package-lock.json

      - name: Verify installed dependency contract
        run: npm run beta:dependencies

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Verify disabled under-13 boundary and child-data registry
        run: npm run guardian:gate

      - name: Unit tests
        run: npm run test:run

      - name: Cinematic timing contracts
        run: npm run test:cinematic

      - name: Worker deployment contract
        run: npm run worker:deployment-check

      - name: Recovery safety contract
        run: npm run recovery:test

      - name: Tone audit (calm invariant)
        run: npm run tone-audit

      - name: Launch audit
        run: npm run launch-audit

      - name: Production build
        run: npm run build

      - name: Install landing test browser
        run: npx playwright install --with-deps chromium

      - name: Verify anonymous production landing animation
        run: npx playwright test --config playwright.landing.config.ts

      - name: Preserve landing browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-browser-evidence
          path: test-results/landing-production
          if-no-files-found: ignore

      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > "${RUNNER_TEMP}/diana-sbom.cdx.json"
          sha256sum "${RUNNER_TEMP}/diana-sbom.cdx.json" > "${RUNNER_TEMP}/diana-sbom.cdx.json.sha256"
          printf '{"schemaVersion":1,"kind":"diana-sbom-provenance","releaseSha":"%s","workflowRunId":"%s","workflowRunAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "${RUNNER_TEMP}/diana-sbom-provenance.json"

      - name: Retain SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diana-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diana-sbom.cdx.json
            ${{ runner.temp }}/diana-sbom.cdx.json.sha256
            ${{ runner.temp }}/diana-sbom-provenance.json
          if-no-files-found: error
          retention-days: 90

  full-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Pin npm toolchain
        run: |
          npm install --global npm@11.11.0 --ignore-scripts
          test "$(npm --version)" = "11.11.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Replay every migration in a disposable database
        shell: pwsh
        run: |
          $workdir = Join-Path $env:RUNNER_TEMP "diana-full-migration-chain"
          $migrationDirectory = Join-Path $workdir "supabase/migrations"
          New-Item -ItemType Directory -Path $migrationDirectory -Force | Out-Null
          @'
          project_id = "diana-full-migration-chain"

          [db]
          major_version = 17
          '@ | Set-Content -LiteralPath (Join-Path $workdir "supabase/config.toml") -Encoding ascii
          Copy-Item -Path "supabase/migrations/*.sql" -Destination $migrationDirectory
          try {
            & npx --yes supabase@2.111.0 start --workdir $workdir `
              -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
            if ($LASTEXITCODE -ne 0) {
              throw "Full migration chain did not apply cleanly."
            }
            $status = (& npx --yes supabase@2.111.0 status --workdir $workdir -o env) -join "`n"
            $databaseUrlMatch = [Regex]::Match($status, '(?m)^DB_URL="?([^"\r\n]+)"?$')
            if (-not $databaseUrlMatch.Success) {
              throw "Supabase status did not return DB_URL."
            }
            $expected = @(Get-ChildItem -LiteralPath $migrationDirectory -Filter "*.sql" -File |
              ForEach-Object { ($_.BaseName -split "_", 2)[0] } |
              Sort-Object -Unique)
            $applied = @(& psql -X -A -t "--dbname=$($databaseUrlMatch.Groups[1].Value)" `
              -c "select version from supabase_migrations.schema_migrations order by version;" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ })
            if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $applied).Count -ne 0) {
              throw "Applied migration ledger does not exactly match the repository."
            }
            & ./supabase/tests/scripts/guardian-under-13-boundary.ps1 `
              -DatabaseUrl $databaseUrlMatch.Groups[1].Value
            if ($LASTEXITCODE -ne 0) {
              throw "Guardian under-13 database boundary did not pass."
            }
            & psql -X "--dbname=$($databaseUrlMatch.Groups[1].Value)" -f "supabase/tests/dashboard_optional_checkin.sql"
            if ($LASTEXITCODE -ne 0) {
              throw "Optional dashboard check-in database contract did not pass."
            }
          }
          finally {
            & npx --yes supabase@2.111.0 stop --workdir $workdir --no-backup
          }

  database-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Supabase binds fixed local ports. Push and pull-request runs for the
    # same repository must not start disposable stacks concurrently.
    concurrency:
      group: diana-database-release-contract
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Pin npm toolchain
        run: |
          npm install --global npm@11.11.0 --ignore-scripts
          test "$(npm --version)" = "11.11.0"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' |
            sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version | grep -E 'PostgreSQL\) 17\.'
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Prepare disposable Supabase baseline
        shell: pwsh
        run: |
          $workdir = Join-Path $env:RUNNER_TEMP "diana-database-release-contract"
          $migrationTarget = 20260731135000L
          $migrationDirectory = Join-Path $workdir "supabase/migrations"
          New-Item -ItemType Directory -Path $migrationDirectory -Force | Out-Null
          @'
          project_id = "diana-database-release-contract"

          [db]
          major_version = 17
          '@ | Set-Content -LiteralPath (Join-Path $workdir "supabase/config.toml") -Encoding ascii
          Get-ChildItem -LiteralPath "supabase/migrations" -Filter "*.sql" -File |
            Where-Object {
              [long](($_.BaseName -split "_", 2)[0]) -le $migrationTarget
            } |
            Copy-Item -Destination $migrationDirectory
          "DATABASE_CONTRACT_WORKDIR=$workdir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run executable database release contract
        shell: pwsh
        run: |
          & npx --yes supabase@2.111.0 start --workdir $env:DATABASE_CONTRACT_WORKDIR `
            -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          if ($LASTEXITCODE -ne 0) {
            throw "Disposable Supabase baseline did not start."
          }
          try {
            $status = (& npx --yes supabase@2.111.0 status `
              --workdir $env:DATABASE_CONTRACT_WORKDIR -o env) -join "`n"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read disposable Supabase status."
            }
            $databaseUrlMatch = [Regex]::Match(
              $status,
              '(?m)^DB_URL="?([^"\r\n]+)"?$'
            )
            if (-not $databaseUrlMatch.Success) {
              throw "Supabase status did not return DB_URL."
            }
            & ./supabase/tests/scripts/database-release-blockers.ps1 `
              -DatabaseUrl $databaseUrlMatch.Groups[1].Value
            if ($LASTEXITCODE -ne 0) {
              throw "Database release contract did not pass."
            }
          }
          finally {
            & npx --yes supabase@2.111.0 stop `
              --workdir $env:DATABASE_CONTRACT_WORKDIR --no-backup
          }
