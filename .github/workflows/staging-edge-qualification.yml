name: Staging Edge qualification

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA matching the completed staging deployment receipt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-edge-qualification
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Require a manual main workflow and full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact release commit to belong to main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  staging-edge-parity:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          persist-credentials: false

      - name: Confirm the qualified source checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Require staging credentials and deployment receipt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STAGING_EDGE_DEPLOYMENT_RECEIPT_JSON: ${{ secrets.STAGING_EDGE_DEPLOYMENT_RECEIPT_JSON }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$STAGING_EDGE_DEPLOYMENT_RECEIPT_JSON"
          receipt_path="${RUNNER_TEMP}/staging-edge-deployment-receipt.json"
          umask 077
          printf '%s\n' "$STAGING_EDGE_DEPLOYMENT_RECEIPT_JSON" > "$receipt_path"
          printf 'STAGING_EDGE_DEPLOYMENT_RECEIPT_PATH=%s\n' "$receipt_path" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Pin npm toolchain
        run: |
          npm install --global npm@11.11.0 --ignore-scripts
          test "$(npm --version)" = "11.11.0"

      - name: Install dependencies
        run: npm ci

      - name: Require exact Edge Function content parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: >-
          npm run edge-functions:parity --
          --receipt="$STAGING_EDGE_DEPLOYMENT_RECEIPT_PATH"
          --release-sha="$RELEASE_SHA"
